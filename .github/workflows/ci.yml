name: VulnImprint source and native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  google-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install C++ and Python formatters
        run: python -m pip install -r requirements-format.txt
      - name: Check first-party source formatting
        run: make format-check
  offline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Verify Git submodule lock
        run: python scripts/verify_dependencies.py --require-checkout
      - name: Validate Git CVE tree (production rules only)
        run: python -m scripts.check_validated_signatures
      - name: Unit tests (no false production admission)
        run: |
          python -m pip install -r requirements-ci.txt
          python -m coverage run -m pytest -q tests tests_release
          python -m coverage report --include='factory/*.py,tools/*.py'
          python -m compileall -q scanner factory tools scripts tests tests_release
  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run Python static security checks
        run: |
          python -m pip install -r requirements-security.txt
          python -m bandit -r factory tools scripts -ll -ii
      - name: Verify pinned upstream dependency metadata
        run: python scripts/verify_dependencies.py
  native:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libssl-dev binutils
      - name: Install pinned Python testing dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate the versioned GCC/Clang source-build matrix
        run: |
          sudo apt-get install -y gcc-11 gcc-12 clang-14 clang-15
          python -m tools.check_toolchain_matrix --out /tmp/vulnimprint-toolchains.json
          python -m pytest -q tests_release/test_toolchain_versions.py
      - name: Preflight ELFIO boundary, fuzzing, JSON and static ELF admission
        run: |
          python -m pytest -q \
            tests_integration/test_elfio_adapter_native.py \
            tests_integration/test_elfio_adapter_fuzz.py \
            tests_integration/test_native_json_serialization.py \
            tests_integration/test_static_product_elf_admission.py
      - name: Identify the pinned upstream build inputs
        id: upstream_sha
        run: echo "value=$(git -C external/yara-x rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned YARA-X Cargo build cache
        id: rust_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
            ~/.cargo/bin/cargo-ctest
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            external/yara-x/target
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-rust-1.99.1-cargo-c-0.10.26-maturin-1.16.0-python-3.12-yarax-${{ steps.upstream_sha.outputs.value }}-${{ hashFiles('external/yara-x/Cargo.lock', 'scripts/bootstrap_yarax.sh', 'scripts/build_yarax_python.sh') }}-v2
      - name: Build pinned YARA-X C API from the recursive Git checkout
        run: |
          bash scripts/bootstrap_yarax.sh --capi-only
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/.local/lib" >> "$GITHUB_ENV"
      - name: Build Python YARA-X bindings from the same pinned upstream source
        run: bash scripts/build_yarax_python.sh
      - name: Save complete pinned YARA-X Cargo build cache
        id: rust_cache_save
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
            ~/.cargo/bin/cargo-ctest
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            external/yara-x/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
      - name: Build VulnImprint scanner and smoke-test the real YARA-X C API
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python3 scripts/native_yarax_smoke.py --scanner build/scanner/vulnimprint-scan
      - name: Test Python YARA-X factory integration
        run: python -m pytest -q tests_integration/test_native_yara_x_factory.py
      - name: Execute complete native-dependent regression suite
        run: python -m pytest -q tests tests_release tests_integration
      - name: Admit complete Git CVE tree against independent specimens
        env:
          VULNIMPRINT_CORPUS_HOST: ${{ vars.VULNIMPRINT_CORPUS_HOST }}
        run: |
          python -m scripts.check_native_cve_corpus \
            --scanner build/scanner/vulnimprint-scan
