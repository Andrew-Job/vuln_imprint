name: VulnImprint CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  google-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-format.txt
      - run: python -m pip install -r requirements-format.txt
      - run: make format-check

  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Validate CVE source and signatures
        run: |
          python -m scripts.check_cve_source_tree
          python -m scripts.check_signature_sources
      - name: Validate modified CVE records
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m scripts.check_cve_pr --base "$BASE_SHA"
      - name: Test product Python code and database/packaging contracts
        run: python -m pytest -q tests tests_release

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security.txt
      - run: python -m pip install -r requirements-security.txt
      - run: python -m bandit -r factory tools scripts -ll -ii

  native:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install product build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libssl-dev binutils
          python -m pip install -r requirements-ci.txt
      - name: Restore YARA-X build cache
        id: rust_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
            ~/.cargo/bin/cargo-ctest
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
            external/yara-x/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-cargo-c-0.10.26-yarax-${{ hashFiles('external/DEPENDENCIES.json', 'external/yara-x/Cargo.lock') }}-v2
      - name: Build actual YARA-X C API and Python binding
        run: |
          bash scripts/bootstrap_yarax.sh --capi-only
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"
          bash scripts/build_yarax_python.sh
      - name: Save YARA-X build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
            ~/.cargo/bin/cargo-ctest
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
            external/yara-x/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
      - name: Build Scanner and exercise executable ELF behavior
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python scripts/native_yarax_smoke.py --scanner build/scanner/vulnimprint-scan
          python -m pytest -q tests_integration
      - name: Compile databases and exercise all production patterns
        run: |
          python -m tools.production_db assemble --signatures signatures \
            --channel test --output /tmp/vulnimprint-db-test \
            --scanner build/scanner/vulnimprint-scan
          python -m tools.production_db assemble --signatures signatures \
            --channel production --output /tmp/vulnimprint-db-production \
            --scanner build/scanner/vulnimprint-scan
          python -m tools.production_db verify \
            --database /tmp/vulnimprint-db-production \
            --scanner build/scanner/vulnimprint-scan
          python -m scripts.check_native_cve_signatures \
            --scanner build/scanner/vulnimprint-scan \
            --database /tmp/vulnimprint-db-production/database.yarc
