name: VulnImprint verified release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: vulnimprint-release
  cancel-in-progress: false
jobs:
  # Unprivileged build job: source of truth is the protected Git tree.
  # It has no permission to publish releases or mint OIDC credentials.
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Factory parsing dependencies for release verification
        run: python -m pip install -r requirements-factory.txt
      - name: Verify exact tagged Git source and successful protected main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_inputs.py
      - name: Build pinned official YARA-X and native scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev binutils
          python scripts/verify_dependencies.py --require-checkout
          bash scripts/bootstrap_yarax.sh
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Compile all production-channel CVE records
        run: |
          python -m tools.production_db assemble --signatures signatures \
            --channel production --output release-output/db \
            --scanner build/scanner/vulnimprint-scan
      - name: Produce packaged native release and release metadata
        env:
          VERSION: ${{ steps.source.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake --install build --prefix "$PWD/native-install"
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")" \
            python -m tools.package_product --database release-output/db \
            --scanner native-install/bin/vulnimprint-scan \
            --version "$VERSION" --output dist/vulnimprint-linux-x86_64.tar.gz
          bash scripts/install_syft.sh
          python -m tools.create_sbom \
            --product dist/vulnimprint-linux-x86_64.tar.gz \
            --syft "$HOME/.local/bin/syft" --output dist/SBOM.spdx.json
          python -m tools.release_approval create --database release-output/db \
            --tag "$VERSION" --source-commit "$GITHUB_SHA" \
            --asset dist/vulnimprint-linux-x86_64.tar.gz \
            --asset dist/SBOM.spdx.json \
            --output dist/release-contents.json
          python -m tools.release_approval verify \
            --contents dist/release-contents.json --assets-dir dist
          (cd dist && sha256sum *.tar.gz *.json > SHA256SUMS)
      - name: Clean installed product smoke (no build environment)
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          mkdir -p /tmp/vulnimprint-clean
          tar -xf dist/vulnimprint-linux-x86_64.tar.gz -C /tmp/vulnimprint-clean
          env -u PYTHONPATH \
            /tmp/vulnimprint-clean/vulnimprint/bin/vulnimprint version | grep -Fx "$VERSION"
          env -u PYTHONPATH \
            /tmp/vulnimprint-clean/vulnimprint/bin/vulnimprint scan --json \
            /tmp/vulnimprint-clean/vulnimprint/bin/vulnimprint-scan \
            >/tmp/vulnimprint-product-smoke.json
          python - <<'PY'
          import json
          with open('/tmp/vulnimprint-product-smoke.json', encoding='utf-8') as stream:
              result = json.load(stream)
          assert result['engine'] == 'yara-x'
          assert len(result['results']) == 1 and result['results'][0]['error'] is None
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnimprint-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Only this job has write, OIDC and attestation scopes. It never executes
  # research specimens or untrusted upstream build recipes.
  publish:
    needs: build-and-validate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download build job's artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulnimprint-release-candidate
          path: dist
      - name: Verify downloaded immutable candidate
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python -m tools.release_approval verify \
            --contents dist/release-contents.json --assets-dir dist
          test "$(git rev-parse HEAD)" = '${{ needs.build-and-validate.outputs.source_sha }}'
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          python scripts/check_gh_version.py
      # Verify SLSA provenance and SPDX SBOM as independent predicates.
      - name: Verify live GitHub release protections before draft creation
        env:
          # Read-only administrative token for branch/ruleset policy inspection.
          # Not a signing key; GitHub Attestations uses short-lived OIDC.
          GH_TOKEN: ${{ secrets.VULNIMPRINT_ADMIN_READ_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Admin read-only preflight token is required' >&2; exit 2; }
          python scripts/verify_repository_settings.py --repo "$GITHUB_REPOSITORY"
      - name: Attest SLSA provenance of all finalized release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*
      - name: Attest SPDX SBOM for the product archive only
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/vulnimprint-linux-x86_64.tar.gz
          sbom-path: dist/SBOM.spdx.json
      - name: Verify build actor, exact source tag and artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/vulnimprint-linux-x86_64.tar.gz \
                       dist/release-contents.json \
                       dist/SBOM.spdx.json \
                       dist/SHA256SUMS; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          gh attestation verify dist/vulnimprint-linux-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Create immutable-bound draft (do not auto-create or move tags)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$VERSION" --verify-tag --draft --repo "$GITHUB_REPOSITORY" \
            --title "VulnImprint $VERSION" \
            --notes "Native YARA-X scanner and Git-tracked machine signatures for Linux ELF64 x86-64. The bundled index records CVE-owned production DB records and source digests; channel assignment and a match alone are not proof of exploitability. SBOM and SHA256SUMS attached." \
            dist/*.tar.gz dist/release-contents.json dist/SBOM.spdx.json dist/SHA256SUMS
      - name: Verify uploaded bytes before making public
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          mkdir -p downloaded
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          for asset in vulnimprint-linux-x86_64.tar.gz \
                       release-contents.json SBOM.spdx.json SHA256SUMS; do
            cmp -- "dist/$asset" "downloaded/$asset"
            gh attestation verify "downloaded/$asset" --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          gh attestation verify downloaded/vulnimprint-linux-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          (cd downloaded && sha256sum -c ../dist/SHA256SUMS)
          python -m tools.release_approval verify \
            --contents downloaded/release-contents.json --assets-dir downloaded
          mkdir -p clean-downloaded
          tar -xf downloaded/vulnimprint-linux-x86_64.tar.gz -C clean-downloaded
          env -u PYTHONPATH clean-downloaded/vulnimprint/bin/vulnimprint version | grep -Fx "$VERSION"
          env -u PYTHONPATH clean-downloaded/vulnimprint/bin/vulnimprint scan --json \
            clean-downloaded/vulnimprint/bin/vulnimprint-scan >/tmp/vulnimprint-release-self-scan.json
          python - <<'PYCODE'
          import json
          with open('/tmp/vulnimprint-release-self-scan.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['engine'] == 'yara-x'
          assert len(result['results']) == 1 and result['results'][0]['error'] is None
          assert result['truncated_files'] == 0 and result['errors'] == 0
          PYCODE
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false
      - name: Confirm immutable release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          gh release verify "$VERSION" --repo "$GITHUB_REPOSITORY"
          for asset in downloaded/vulnimprint-linux-x86_64.tar.gz \
                       downloaded/release-contents.json \
                       downloaded/SBOM.spdx.json \
                       downloaded/SHA256SUMS; do
            gh release verify-asset "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY"
          done
